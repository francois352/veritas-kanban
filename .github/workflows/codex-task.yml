name: Codex Task (auto-PR)

# Runs Codex CLI inside the Action runner, opens a PR with any changes.
# Trigger: gh workflow run codex-task.yml -f prompt="..."  OR  repository_dispatch type=codex-task
# Safety: all user-supplied content (prompt, branch_prefix, kanban_task_id) flows through env vars,
# never via ${{ ... }} directly in run: blocks. See:
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for Codex (single focused task)'
        required: true
        type: string
      branch_prefix:
        description: 'Branch name prefix (default: codex/auto)'
        required: false
        type: string
        default: 'codex/auto'
      kanban_task_id:
        description: 'Optional Veritas kanban task id to link in PR body'
        required: false
        type: string
  repository_dispatch:
    types: [codex-task]

permissions:
  contents: write
  pull-requests: write

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INPUT_PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt }}
      INPUT_BRANCH_PREFIX: ${{ github.event.inputs.branch_prefix || github.event.client_payload.branch_prefix || 'codex/auto' }}
      KANBAN_TASK_ID: ${{ github.event.inputs.kanban_task_id || github.event.client_payload.kanban_task_id }}
    steps:
      - name: Preflight
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$INPUT_PROMPT" ]; then
            echo "::error::No prompt provided."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (codex login dependency)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Authenticate Codex
        run: codex login --api-key "$OPENAI_API_KEY"

      - name: Run Codex (full-auto, workspace-write sandbox)
        id: codex
        run: |
          set -euo pipefail
          codex exec --full-auto --sandbox workspace-write "$INPUT_PROMPT" 2>&1 | tee codex-output.log
          DELIM="EOF_$(date +%s)_$RANDOM"
          {
            echo "files_changed<<$DELIM"
            git status --porcelain || true
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Diff summary
        if: always()
        run: |
          echo "=== files changed ==="; git status --porcelain || true
          echo "=== diff stat ==="; git diff --stat HEAD || true

      - name: Compute branch + PR body
        id: meta
        run: |
          set -euo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          BRANCH="${INPUT_BRANCH_PREFIX}-${TS}-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          PROMPT_FIRST_LINE=$(printf '%s' "$INPUT_PROMPT" | head -n 1 | cut -c 1-72)
          echo "title=Codex task: $PROMPT_FIRST_LINE" >> "$GITHUB_OUTPUT"
          if [ -n "$KANBAN_TASK_ID" ]; then
            KANBAN_LINE="Linked kanban task: \`$KANBAN_TASK_ID\` (https://bot.srv929662.hstgr.cloud/kanban/)"
          else
            KANBAN_LINE="No linked kanban task."
          fi
          {
            echo "## Codex task auto-PR"
            echo
            echo "Run: \`$GITHUB_RUN_ID\` on workflow \`codex-task\`"
            echo "Trigger: $GITHUB_EVENT_NAME"
            echo "$KANBAN_LINE"
            echo
            echo "### Prompt"
            echo
            echo '```'
            printf '%s\n' "$INPUT_PROMPT"
            echo '```'
            echo
            echo "### Codex output (last 80 lines)"
            echo
            echo '```'
            tail -80 codex-output.log 2>/dev/null || echo '(no log captured)'
            echo '```'
            echo
            echo "Generated by Codex CLI in GitHub Actions. Review the diff before merging."
          } > pr-body.md

      - name: Create pull request
        id: cpr
        if: steps.codex.outputs.files_changed != ''
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.meta.outputs.branch }}
          base: main
          commit-message: ${{ steps.meta.outputs.title }}
          title: ${{ steps.meta.outputs.title }}
          body-path: pr-body.md
          labels: codex-auto-pr,automated
          delete-branch: true
          draft: false

      - name: Post kanban comment with PR link
        if: env.KANBAN_TASK_ID != '' && steps.codex.outputs.files_changed != ''
        env:
          KANBAN_API_TOKEN: ${{ secrets.KANBAN_API_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          if [ -z "$KANBAN_API_TOKEN" ]; then
            echo "::warning::No KANBAN_API_TOKEN secret -- skipping kanban comment"
            exit 0
          fi
          PAYLOAD=$(printf '{"text":"Codex auto-PR opened: %s (Action run %s)"}' "$PR_URL" "$GITHUB_RUN_ID")
          curl -sS -X POST "https://bot.srv929662.hstgr.cloud/kanban/api/v1/tasks/$KANBAN_TASK_ID/comments" \
            -H "Authorization: Bearer $KANBAN_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Kanban-Actor: codex" \
            -d "$PAYLOAD" \
            || echo "::warning::Kanban comment failed (non-fatal)"

      - name: No-op (no changes from Codex)
        if: steps.codex.outputs.files_changed == ''
        run: echo "::notice::Codex made no changes. Nothing to PR."
